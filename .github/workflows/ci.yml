name: CI

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # cargo check/test compile the tauri crate, so the WebKit/GTK headers are
      # needed even though CI never produces a bundle. Keep this list aligned
      # with the Linux job in release.yml.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libdbus-1-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libatk1.0-dev \
            libcairo2-dev \
            libx11-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxrandr-dev \
            libxkbcommon-dev \
            libxkbfile-dev \
            libsecret-1-dev \
            libharfbuzz-dev \
            libepoxy-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libgraphene-1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libgstreamer-plugins-base1.0-dev \
            librsvg2-dev \
            libxdo-dev \
            wget

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Frontend build
        run: npm run build:client

      - name: Rust check
        run: cargo check
        working-directory: src-tauri

      - name: Rust tests
        run: cargo test
        working-directory: src-tauri
